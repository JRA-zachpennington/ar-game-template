plugins = []

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Deep links. Exact paths only, so /instructions/*.mp3 still serves briefing audio.
# force wins over the public/instructions directory for the page itself.
[[redirects]]
  from = "/instructions"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/instructions/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/game"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/game/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/win"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/win/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/journal"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/journal/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
